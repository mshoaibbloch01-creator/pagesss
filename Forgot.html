<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card -->
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl p-6 sm:p-10">

        <!-- Help -->
        <div class="flex justify-end">
            <a href="#" class="text-indigo-600 text-sm font-medium hover:underline">
                Need Help?
            </a>
        </div>

        <!-- Heading -->
        <div class="text-center mt-4">
            <h1 class="text-3xl sm:text-5xl font-bold text-gray-900">
                Verify your email
            </h1>

            <p class="text-gray-500 mt-4 text-base sm:text-lg">
                Enter the 6-digit OTP sent to
            </p>

            <p class="text-indigo-600 font-semibold text-base sm:text-xl mt-2 break-all">
                shoaibbloch@email.com
            </p>
        </div>

        <!-- OTP Inputs -->
        <div class="flex justify-center gap-2 sm:gap-4 mt-10 overflow-x-auto pb-2">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border-2 border-indigo-600 rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

            <input type="text" maxlength="1" inputmode="numeric"
                class="w-10 h-12 sm:w-14 sm:h-16 border rounded-lg text-center text-xl sm:text-2xl outline-none flex-shrink-0">

        </div>

        <!-- Resend -->
        <div class="text-center mt-8 text-gray-500 text-sm sm:text-base">
            Didn't receive the code?
            <span class="text-indigo-600 font-semibold">
                Resend in 00:45
            </span>
        </div>

        <!-- Verify Button -->
        <button
            class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition">
            Verify OTP
        </button>

        <!-- Divider -->
        <div class="flex items-center my-8">
            <hr class="flex-1 border-gray-300">
            <span class="mx-4 text-gray-400">or</span>
            <hr class="flex-1 border-gray-300">
        </div>

        <!-- Go Back -->
        <a href="Signup.html"
            class="block w-full text-center border-2 border-indigo-600 text-indigo-600 py-3 rounded-lg font-semibold hover:bg-indigo-50 transition">
            ← Go Back
        </a>

    </div>

</body>
</html>
