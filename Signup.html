<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-3">

<div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5">

    <div class="flex justify-center">
        <div class="w-16 h-16 rounded-2xl bg-green-100 flex items-center justify-center">
            <span class="text-3xl font-bold text-green-600">MS</span>
        </div>
    </div>

    
    <h1 class="text-2xl font-bold text-center">
        Create Account
    </h1>

    <p class="text-center text-gray-500 text-sm mt-1 mb-4">
        Sign up to create your account
    </p>

    <!-- Full Name -->
    <label class="font-medium text-sm">Full Name</label>

    <div class="flex items-center border rounded-lg px-3 py-2 mt-1">
        <i class="fa-solid fa-user text-gray-400"></i>

        <input
        type="text"
        placeholder="Enter your full name"
        class="w-full ml-3 outline-none text-sm">
    </div>

    <!-- Email -->
    <label class="font-medium text-sm block mt-3">Email</label>

    <div class="flex items-center border rounded-lg px-3 py-2 mt-1">
        <i class="fa-solid fa-envelope text-gray-400"></i>

        <input
        type="email"
        placeholder="Enter your email"
        class="w-full ml-3 outline-none text-sm">
    </div>

    <!-- Password -->
    <label class="font-medium text-sm block mt-3">Password</label>

    <div class="flex items-center border rounded-lg px-3 py-2 mt-1">
        <i class="fa-solid fa-lock text-gray-400"></i>

        <input
        type="password"
        placeholder="Create password"
        class="w-full ml-3 outline-none text-sm">

        <i class="fa-regular fa-eye text-gray-400"></i>
    </div>

    <!-- Confirm Password -->
    <label class="font-medium text-sm block mt-3">Confirm Password</label>

    <div class="flex items-center border rounded-lg px-3 py-2 mt-1">
        <i class="fa-solid fa-lock text-gray-400"></i>

        <input
        type="password"
        placeholder="Confirm password"
        class="w-full ml-3 outline-none text-sm">

        <i class="fa-regular fa-eye text-gray-400"></i>
    </div>

    <!-- Button -->
    <button class="w-full mt-5 py-2.5 rounded-lg text-white font-semibold bg-gradient-to-r from-violet-600 to-purple-600">
        Sign Up
    </button>

    <!-- Divider -->
    <div class="flex items-center my-4">
        <hr class="flex-1">
        <span class="mx-3 text-gray-500 text-sm">or</span>
        <hr class="flex-1">
    </div>

    <!-- Login -->
    <p class="text-center text-sm text-gray-600">
        Already have an account?
        <a href="Login.html" class="text-violet-600 font-semibold">
            Login
        </a>
    </p>

</div>

</body>
</html>
