<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

<div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6">


    
    <div class="flex justify-center">
        <div class="w-16 h-16 rounded-2xl bg-green-100 flex items-center justify-center">
            <span class="text-3xl font-bold text-green-600">MS</span>
        </div>
    </div>

    <h1 class="text-3xl font-bold text-center">
        Welcome Back
    </h1>

    <p class="text-center text-gray-500 mt-2 mb-6">
        Login to your account
    </p>

    <!-- Email -->
    <label class="font-medium">Email</label>

    <div class="flex items-center border rounded-lg px-3 py-3 mt-2">
        <i class="fa-solid fa-envelope text-gray-400"></i>

        <input
        type="email"
        placeholder="Enter your email"
        class="w-full ml-3 outline-none">
    </div>

    <!-- Password -->
    <label class="font-medium block mt-4">
        Password
    </label>

    <div class="flex items-center border rounded-lg px-3 py-3 mt-2">
        <i class="fa-solid fa-lock text-gray-400"></i>

        <input
        type="password"
        placeholder="Enter your password"
        class="w-full ml-3 outline-none">

        <i class="fa-regular fa-eye text-gray-400"></i>
    </div>

    <div class="text-right mt-3">
        <a href="ForgotPassword.html"
        class="text-purple-600 text-sm">
            Forgot Password?
        </a>
    </div>

    <!-- Button -->
     <button>
    <a href="Forgot.html">
    <button type="button" class="bg-purple-600 text-white w-full py-2 rounded-lg">
        Login
    </button>
</a>

    <!-- Divider -->
    <div class="flex items-center my-6">
        <hr class="flex-1">
        <span class="mx-4 text-gray-500">or</span>
        <hr class="flex-1">
    </div>

    <p class="text-center text-gray-600">
        Don't have an account?
        <a href="Signup.html" class="text-purple-600 font-semibold">
            Sign Up
        </a>
    </p>

</div>

</body>
</html>
